<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Smart Personal & Collaborative Expense Management</title>
  <meta name="description" content="Spendly: Real-time collaborative group expense splitting, personal budgeting, deterministic financial settlements, and permanent billing cycles." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts: Outfit (Luxury Headings) and Inter (Crisp Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/views.css" />
</head>
<body>
  <div id="app-root">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <button class="menu-toggle-btn" id="menu-toggle-btn" aria-label="Toggle navigation menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <a href="#/own-expenses" class="brand-logo">
          <div class="logo-icon">₹</div>
          <span>Spendly</span>
        </a>
      </div>

      <div class="header-right">
        <!-- Live / Offline Sync Status -->
        <div class="sync-indicator online" id="header-sync-status">
          <span class="sync-dot" id="header-sync-dot"></span>
          <span id="header-sync-text">Live</span>
        </div>

        <!-- In-App Notification Center Bell -->
        <div style="position: relative;">
          <button class="notification-bell-btn" id="notification-bell-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="badge-count" id="notification-badge-count" style="display: none;">0</span>
          </button>

          <!-- Notification Dropdown Panel -->
          <div class="notifications-dropdown" id="notifications-dropdown">
            <div class="notifications-header">
              <span style="font-family: var(--font-heading); font-weight: 700; font-size: 16px;">Notifications</span>
              <button class="btn btn-sm btn-secondary" id="mark-all-read-btn" style="padding: 4px 8px; font-size: 11px;">
                Mark all read
              </button>
            </div>
            <div class="notifications-list" id="notifications-list">
              <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">
                Loading notifications...
              </div>
            </div>
          </div>
        </div>

        <!-- Header Profile Button -->
        <a href="#/profile" class="header-user-btn" id="header-user-avatar" title="View Profile"></a>
      </div>
    </header>

    <!-- Global Offline Alert Banner (Section 52) -->
    <div class="offline-banner hidden" id="global-offline-banner">
      <span>📡 You are currently offline. You can still record expenses; they will safely sync when you reconnect.</span>
      <button class="offline-banner-btn" id="retry-sync-btn">Sync Now</button>
    </div>

    <!-- Navigation Sidebar (Section 14) -->
    <aside class="app-sidebar">
      <ul class="sidebar-nav-list">
        <li>
          <a href="#/own-expenses" class="nav-item-link" id="nav-own-expenses">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Own Expenses</span>
          </a>
        </li>
        <li>
          <a href="#/split-it" class="nav-item-link" id="nav-split-it">
            <svg viewBox="0 0 24 24" fill="none"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Split It</span>
          </a>
        </li>
        <li>
          <a href="#/bill" class="nav-item-link" id="nav-bill">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Bill</span>
          </a>
        </li>
        <li>
          <a href="#/analytics" class="nav-item-link" id="nav-analytics">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Analytics</span>
          </a>
        </li>
      </ul>

      <!-- Profile Section: Positioned at the bottom, visually separated (Section 14) -->
      <div class="sidebar-bottom">
        <a href="#/profile" class="nav-item-link" id="nav-profile">
          <svg viewBox="0 0 24 24" fill="none"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Profile</span>
        </a>
      </div>
    </aside>

    <!-- Mobile Drawer Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Content Area -->
    <main class="app-content">
      <div id="main-view-container"></div>
    </main>

    <!-- Native HTML5 <dialog> for Modals -->
    <dialog id="global-modal-dialog" class="spendly-modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-title-text">Modal Title</div>
        <button class="modal-close-btn" id="modal-close-x" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body" id="modal-body-content"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm-btn">Confirm</button>
      </div>
    </dialog>

    <!-- Floating Toast Notifications Container -->
    <div id="toast-container" aria-live="polite"></div>
  </div>

  <!-- Client JavaScript Modules -->
  <script src="/js/idb.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/views/authView.js"></script>
  <script src="/js/views/ownExpensesView.js"></script>
  <script src="/js/views/splitItView.js"></script>
  <script src="/js/views/billView.js"></script>
  <script src="/js/views/analyticsView.js"></script>
  <script src="/js/views/profileView.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
