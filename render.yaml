services:
  - type: web
    name: spendly
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: spendly-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/spendly.db
      - key: UPLOAD_DIR
        value: /data/uploads/avatars
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@spendly.app
